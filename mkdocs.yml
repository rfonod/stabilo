site_name: Stabilo
site_url: https://rfonod.github.io/stabilo/
site_description: Reference-frame stabilization of videos and object trajectories, with optional exclusion masks.
site_author: Robert Fonod
repo_name: rfonod/stabilo
repo_url: https://github.com/rfonod/stabilo
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Robert Fonod. Distributed under the MIT License.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  icon:
    repo: fontawesome/brands/github

nav:
  - Home: index.md
  - Usage: usage.md
  - Feature detectors and matchers: detectors.md
  - CUDA: cuda.md
  - CLI reference: cli.md
  - API reference: api.md
  - Citation: citation.md

exclude_docs: |
  /hooks/

hooks:
  - docs/hooks/cli_help.py

validation:
  omitted_files: warn
  not_found: warn
  unrecognized_links: warn
  anchors: warn

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [.]
      check_paths: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [.]

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rfonod/stabilo
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/stabilo/
