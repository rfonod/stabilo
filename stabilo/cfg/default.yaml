# =============================================================================
# stabilo - default configuration
# =============================================================================
# These defaults are tuned for the ORB detector, brute-force (BF) matcher,
# Lowe's ratio test, and a projective transformation, balancing accuracy against
# speed for high-altitude bird's-eye-view (BeV) drone imagery.
#
# They were obtained on a set of BeV drone scenes with associated vehicle masks,
# captured from roughly 150 m altitude. With the projective transformation fixed,
# the remaining parameters were optimized hierarchically. See:
# https://github.com/rfonod/stabilo-optimize
#
# Usage:
#   stabilo config show            # print this file
#   stabilo config copy            # write an editable copy to ./custom.yaml
#   stabilo video <input> --save --custom-config custom.yaml
#
# Only the keys present in this file are configurable. Every key can also be
# passed directly to Stabilizer(...) as a keyword argument. Each parameter is
# documented in more detail in docs/usage.md and in the stabilo/stabilo.py
# module docstring.
# =============================================================================


# -----------------------------------------------------------------------------
# Feature detection
# -----------------------------------------------------------------------------
# Classical detectors ('orb', 'sift', 'rsift', 'brisk', 'kaze', 'akaze') ship with
# OpenCV. Learning-based detectors ('xfeat', 'disk', 'dedode', 'keynet', 'loftr')
# come from kornia and download pretrained weights on first use (cached under
# torch.hub's directory; set TORCH_HOME to relocate it).
# 'loftr' is detector-free: it matches an image pair directly, so 'matcher_name'
# and 'filter_type' are ignored when it is selected.
#
# Two caveats apply to the learning-based detectors:
#   Rotation. 'xfeat', 'disk', 'dedode', and 'loftr' are upright models; matching
#     collapses once the current frame is rotated more than roughly 30 degrees from
#     the reference frame. Only 'keynet' (which estimates keypoint orientation) and
#     the classical detectors are rotation invariant.
#   Memory. They are far hungrier than the classical detectors at high resolution.
#     Lower 'downsample_ratio' for large inputs; 'loftr' scales quadratically with
#     the pixel count. A warning is emitted when the frame size looks risky.
detector_name: 'orb'  # ['orb', 'sift', 'rsift', 'brisk', 'kaze', 'akaze', 'xfeat', 'disk', 'dedode', 'keynet', 'loftr']
max_features: 2000  # Max. keypoints detected in the current frame; (0, inf)
ref_multiplier: 2.0  # Reference frame detects ref_multiplier x max_features keypoints; [1.0, inf)

# -----------------------------------------------------------------------------
# Feature matching and filtering
# -----------------------------------------------------------------------------
# 'bf' and 'flann' are OpenCV descriptor matchers. 'lightglue' is a learned matcher
# (kornia) and is only compatible with the 'disk', 'dedode', and 'keynet' detectors;
# it does its own filtering, so 'filter_type' is ignored when it is selected.
matcher_name: 'bf'  # ['bf', 'flann', 'lightglue']
filter_type: 'ratio'  # ['none', 'ratio', 'distance']
filter_ratio: 0.9  # Lowe's ratio ('ratio') or distance-threshold ratio ('distance'); (0.0, 1.0]
match_query_frame: 'reference'  # Which frame's descriptors are the knnMatch query; ['reference', 'current']

# -----------------------------------------------------------------------------
# Transformation estimation
# -----------------------------------------------------------------------------
# The estimated matrix maps the current frame onto the reference frame, so the
# RANSAC reprojection threshold is expressed in reference-frame pixels.
#
# Not every ransac_method works with every transformation_type. 'projective'
# (cv2.findHomography) accepts all of them, whereas 'affine'
# (cv2.estimateAffinePartial2D) accepts ONLY 4 (LMEDS) and 8 (RANSAC); any other
# code, including the default 38, is rejected when the Stabilizer is created.
transformation_type: 'projective'  # ['projective' (3x3 homography, any ransac_method), 'affine' (2x3, ransac_method 4 or 8 only)]
ransac_method: 38  # [4: LMEDS, 8: RANSAC, 16: RHO, 32: USAC-Default (LO-RANSAC), 33: USAC-Parallel (LO-RANSAC), 35: USAC-Fast (LO-RANSAC), 36: USAC-Accurate (GC-RANSAC), 37: PROSAC, 38: MAGSAC++]
ransac_epipolar_threshold: 2.0  # Reprojection-error threshold in pixels; (0.0, inf)
ransac_max_iter: 5000  # Max. RANSAC iterations; (0, inf)
ransac_confidence: 0.999999  # Required RANSAC confidence level; (0.0, 1.0]

# -----------------------------------------------------------------------------
# Exclusion masks
# -----------------------------------------------------------------------------
# Exclusion masks suppress keypoints on dynamic objects (e.g. moving vehicles),
# which would otherwise drag the estimated transformation with them.
mask_use: true  # Honour the bounding boxes passed to set_ref_frame()/stabilize(); [true, false]
mask_margin_ratio: 0.15  # Fractional margin grown around each exclusion region; [0.0, 1.0]

# -----------------------------------------------------------------------------
# Image pre-processing
# -----------------------------------------------------------------------------
clahe: false  # Apply Contrast Limited Adaptive Histogram Equalization; [true, false]
downsample_ratio: 0.5  # Detect on a resized frame, then rescale keypoints to full resolution; (0.0, 1.0]

# -----------------------------------------------------------------------------
# Hardware acceleration
# -----------------------------------------------------------------------------
# Two independent, mutually exclusive acceleration paths:
#
#   gpu     -> OpenCV CUDA. Accelerates detection, matching, and frame warping for
#              the CLASSICAL detectors. Requires an OpenCV built with CUDA support
#              (see docs/cuda.md); currently only detector_name='orb' is supported.
#              RANSAC always runs on the CPU (OpenCV has no CUDA equivalent).
#
#   device  -> PyTorch device. Selects where the LEARNING-BASED detectors/matchers
#              run. Ignored by the classical detectors. 'auto' picks cuda > mps > cpu.
#
# Setting gpu: true together with a learning-based detector is rejected; use
# device: 'cuda' instead.
gpu: false  # OpenCV CUDA acceleration (classical detectors only); [true, false]
gpu_device_id: 0  # CUDA device index used when gpu is true; [0, inf)
device: 'auto'  # Torch device (learning-based detectors/matchers only); ['auto', 'cpu', 'cuda', 'mps']

# -----------------------------------------------------------------------------
# Detector-specific settings
# -----------------------------------------------------------------------------
# Classical. BRISK/KAZE/AKAZE take a response threshold rather than a keypoint
# count; stabilo derives it from max_features via a pre-fitted regression model
# and only falls back to the values below when no model file is available.
sift_enable_precise_upscale: false  # SIFT/RSIFT: precise sub-pixel upscaling at octave -1; [true, false]
rsift_eps: 0.00000001  # RSIFT: L1-normalization epsilon (1e-8); (0.0, inf)
brisk_threshold: 130  # BRISK: fallback threshold; (0, 255]
kaze_threshold: 0.01  # KAZE: fallback threshold; (0.0, inf)
akaze_threshold: 0.01  # AKAZE: fallback threshold; (0.0, inf)

# Learning-based (kornia). Weights are downloaded on first use and cached by torch.
# The DeDoDe 'G' descriptor is backed by a DINOv2 ViT-L (a 1.2 GB extra download and
# roughly double the memory of 'B') and is not more rotation robust, so 'B' is the
# default. The 'C4'/'SO2' descriptor variants need a steerer at match time, which
# kornia does not apply, so they are no more rotation robust than the upright ones.
loftr_weights: 'outdoor'  # LoFTR: pretrained weights; ['outdoor', 'indoor']
loftr_confidence: 0.0  # LoFTR: min. correspondence confidence to keep; [0.0, 1.0] (0.0 keeps all)
disk_weights: 'depth'  # DISK: pretrained weights; ['depth', 'epipolar']
dedode_detector_weights: 'L-C4-v2'  # DeDoDe: detector weights; ['L-upright', 'L-C4', 'L-SO2', 'L-C4-v2']
dedode_descriptor_weights: 'B-upright'  # DeDoDe: descriptor weights; ['B-upright', 'G-upright', 'B-C4', 'B-SO2', 'G-C4', 'G-SO2']

# -----------------------------------------------------------------------------
# Diagnostics
# -----------------------------------------------------------------------------
viz: false  # Retain keypoints, masks, and inliers for visualization; [true, false]
benchmark: false  # Benchmark mode: fall back to identity, suppress warnings; [true, false]
min_good_match_count_warning: 20  # Warn when fewer than this many good matches are found; [0, inf)
min_inliers_match_count_warning: 10  # Warn when fewer than this many inliers are found; [0, inf)
